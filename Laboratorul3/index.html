<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piatra, Hârtia, Foarfeca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #fff;
            color: #000;
            font-family: "Geist Pixel", monospace;
        }

        main {
            max-width: 700px;
            margin: 0 auto;
        }

        h1, h2 {
            font-weight: 400;
        }

        section {
            margin-bottom: 35px;
        }

        button {
            background: #000;
            color: #fff;
            border: 1px solid #000;
            padding: 10px 14px;
            margin: 4px;
            font-family: inherit;
            cursor: pointer;
        }

        button:hover {
            background: #fff;
            color: #000;
        }

        #gameInfo {
            margin-top: 20px;
            border: 1px solid #000;
            padding: 18px;
            line-height: 1.7;
        }

        .line {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <main>
        <h1>Piatra, Hârtia, Foarfeca</h1>

        <section>
            <h2>Exercițiul 1</h2>
            <p>Rezultatele funcției calculateSum() sunt afișate în consolă.</p>
        </section>

        <section>
            <h2>Exercițiul 2</h2>
            <p>Datele obiectului student sunt afișate în consolă.</p>
        </section>

        <section>
            <h2>Exercițiul 3</h2>

            <button id="rock">Piatra</button>
            <button id="paper">Hârtia</button>
            <button id="scissors">Foarfeca</button>
            <button id="newGame">Joc nou</button>

            <div id="gameInfo">
                <div class="line">Alege o opțiune pentru a începe jocul.</div>
                <div class="line">Scor: 0 - 0</div>
                <div class="line">Runde: 0</div>
                <div class="line">Conducător: Egalitate</div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
